# Publish to npm when a version tag (v1.2.3) is pushed. Uses npm trusted publishing (OIDC): no token
# is stored in the repo. The package's npm settings must name this repo and this workflow file.
name: release

on:
    push:
        tags: ['v*']

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        # Must match the environment named in the npm trusted publisher settings. Add required reviewers
        # to this environment in the GitHub repo settings to approve each release by hand.
        environment: npm
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
            # Trusted publishing needs a recent npm; vitest 5 also needs it (repo CLAUDE.md).
            - run: npm install -g npm@latest
            - name: Tag must match package.json version
              run: |
                  v="$(node -p "require('./package.json').version")"
                  if [ "v$v" != "$GITHUB_REF_NAME" ]; then
                      echo "tag $GITHUB_REF_NAME does not match package.json version $v" >&2
                      exit 1
                  fi
            - run: npm ci
            # The same audit as ci.yml (the bundled libraries are devDependencies, so it covers them).
            - name: Audit (fails on high or critical)
              run: npm audit --audit-level=high
            - run: npm run typecheck
            - run: npm run format:check
            # The build regenerates the plugin files and server.json from package.json. A tagged commit whose
            # committed copies differ from the build output, or that lacks a generated file, would publish
            # stale files: stop here. The same step runs in ci.yml (scripts/check-generated.ts).
            - run: npm run build
            - name: Generated files are up to date
              run: npm run check:generated
            # prepublishOnly runs the build and the full test suite before the upload.
            - run: npm publish --provenance --access public

    # List the release in the official MCP Registry (registry.modelcontextprotocol.io). A separate job, so
    # a failed listing can be re-run by itself ("Re-run failed jobs") without a second npm publish, which
    # npm would refuse. Login uses GitHub OIDC (id-token: write above): no secret is stored. The registry
    # accepts the entry only when the published package.json mcpName equals server.json `name`.
    registry:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            # Pinned like the actions above. Bump both lines together, from the release asset
            # registry_<version>_checksums.txt (the line for mcp-publisher_linux_amd64.tar.gz).
            MCP_PUBLISHER_VERSION: '1.8.1'
            MCP_PUBLISHER_SHA256: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
        steps:
            - uses: actions/checkout@v7.0.1
            # server.json is generated by `npm run build` with the package.json version, and the publish job
            # stopped on a stale copy, so the checked-out file is already this release's.
            - name: Install mcp-publisher
              run: |
                  f=mcp-publisher_linux_amd64.tar.gz
                  curl -fsSL -o "$f" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/$f"
                  echo "${MCP_PUBLISHER_SHA256}  $f" | sha256sum -c -
                  tar xzf "$f" mcp-publisher
            - run: ./mcp-publisher login github-oidc
            # npm can take a moment to serve a new version (the registry answers "... (status: 404)"), and the
            # registry reports npm 429 and 5xx as "(status: 429)" / "(status: 5xx). Likely transient, retry
            # later" (registry v1.8.1 internal/validators/registries/npm.go). Retry those only; any other
            # failure stops at once. No sleep after the last attempt.
            - name: Publish to the MCP Registry
              run: |
                  attempts=6
                  for i in $(seq 1 "$attempts"); do
                      if out="$(./mcp-publisher publish 2>&1)"; then
                          echo "$out"
                          exit 0
                      fi
                      echo "$out" >&2
                      case "$out" in
                          *'status: 404'* | *'status: 429'* | *'status: 5'[0-9][0-9]* | *'Likely transient'*) ;;
                          *) exit 1 ;;
                      esac
                      if [ "$i" -lt "$attempts" ]; then
                          echo "npm answer looks transient; retry $((i + 1)) of $attempts in 20 s" >&2
                          sleep 20
                      fi
                  done
                  exit 1
